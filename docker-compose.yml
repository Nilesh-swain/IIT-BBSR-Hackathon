version: "3.9"

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - appnet

  # Frontend Web Server
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_NASA_API_KEY=ckfrdvoegfX4HecZhliguIiOdFxhGWXfLeHQ2VsK
        - VITE_NASA_BASE_URL=https://api.nasa.gov/neo/rest/v1
        - VITE_API_BASE_URL=/api
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
